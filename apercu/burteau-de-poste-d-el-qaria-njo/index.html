<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Burteau de poste d'El Qaria - Votre bureau de poste à Dar El Beida</title>
    <meta name="description" content="Découvrez les services essentiels de votre bureau de poste Burteau de poste d'El Qaria à Dar El Beida. Courrier, colis, services financiers et plus encore.">
    <style>
        :root {
            --primary-color: #0056b3; /* Algerian Post blue */
            --secondary-color: #f0f2f5; /* Light grey background */
            --text-color: #333;
            --light-text-color: #fff;
            --border-color: #ddd;
            --hero-bg-image: url('data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='); /* Placeholder */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            line-height: 1.6;
            background-color: var(--secondary-color);
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Mandatory Banner */
        .besma-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #222;
            color: var(--light-text-color);
            padding: 8px 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
            line-height: 1.3;
        }
        .besma-banner img {
            height: 22px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .besma-banner span {
            text-align: center;
        }
        .besma-banner a {
            color: #87ceeb;
            margin-left: 5px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .besma-banner a:hover {
            text-decoration: underline;
        }

        /* Header */
        header {
            background-color: var(--light-text-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 40px; /* Adjust for banner height */
            z-index: 999;
            width: 100%;
            box-sizing: border-box;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav li {
            margin-left: 25px;
        }
        nav a {
            color: var(--text-color);
            font-weight: 500;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: var(--primary-color);
            text-decoration: none;
        }
        .header-actions {
            display: flex;
            align-items: center;
        }
        .header-phone {
            margin-right: 20px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn {
            background-color: var(--primary-color);
            color: var(--light-text-color);
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #004494;
            text-decoration: none;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--hero-bg-image) center center/cover no-repeat;
            color: var(--light-text-color);
            text-align: center;
            padding: 100px 20px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 500px;
            margin-top: 40px; /* Adjust for banner height */
            box-sizing: border-box;
        }
        .hero h1 {
            font-size: 3em;
            margin-bottom: 20px;
            max-width: 800px;
            line-height: 1.2;
        }
        .hero p {
            font-size: 1.2em;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .hero-actions .btn {
            margin: 0 10px;
        }

        /* Sections */
        section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        section:nth-of-type(odd) {
            background-color: var(--light-text-color);
        }
        h2 {
            font-size: 2.5em;
            margin-bottom: 40px;
            color: var(--primary-color);
        }
        .text-content {
            font-size: 1.1em;
            max-width: 800px;
            margin: 0 auto 40px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }
        .service-item {
            background-color: var(--secondary-color);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: left;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .service-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .service-item h3 {
            color: var(--primary-color);
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .service-item p {
            font-size: 1em;
            color: var(--text-color);
        }

        /* Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item img:hover {
            transform: scale(1.03);
        }
        .gallery-note {
            margin-top: 20px;
            font-style: italic;
            color: #666;
        }

        /* Contact Section */
        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
            font-size: 1.1em;
        }
        .contact-info p {
            margin: 0;
        }
        .contact-info a {
            font-weight: bold;
        }
        .contact-message {
            margin-top: 30px;
            font-style: italic;
            color: #666;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: var(--light-text-color);
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9em
